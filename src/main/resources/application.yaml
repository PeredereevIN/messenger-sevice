server:
  port: 8081
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/message_aggregator
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          # Адрес auth-сервиса для получения публичного ключа (JWKS)
          jwk-set-uri: http://localhost:8080/api/v1/.well-known/jwks.json
          # issuer-uri: http://auth-service:8080/api/v1

vk:
  api:
    base-url: https://api.vk.com/method
    access-token: stub   # пока заглушка
    version: "5.131"

logging:
  level:
    org.springframework.security.oauth2: DEBUG